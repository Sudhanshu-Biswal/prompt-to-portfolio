[project]
name = "prompt-to-portfolio"
version = "0.1.0"
description = "Agentic portfolio generator — prompt + profile data → live portfolio site"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",       # resume file upload

    # LangGraph + LangChain
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",

    # MCP
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",

    # LLM
    "openai>=1.30.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Persistence
    "redis[asyncio]>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Embeddings (for profession type matching)
    "numpy>=1.26.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",              # retry with backoff
    "tiktoken>=0.7.0",              # token counting for context budget
    "structlog>=24.1.0",            # structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",                # test client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]